      - {palier: 2, si: "l'enseignement d'un maître ninja médecin",
         indice: "« Tu stockes. Depuis quand ? » Tu ne sais pas répondre."}
      - {palier: 3, si: "une situation où tu es le dernier rempart d'un mourant",
         indice: "Le losange s'est ouvert. Tes blessures se sont refermées avec les siennes."}
    contraintes:
      - {type: prix, note: "Libérer le sceau vide en un instant des années de réserve."}

  - id: aptitude_senjutsu
