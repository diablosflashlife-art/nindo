  - id: sceau_byakugo
    nom: "Sceau de la réserve"
    famille: medical
    rarete: tres_rare
    accorde: {stats: {controle_chakra: 3, chakra: 4, endurance: 2}}
    revelation_initiale: "Un losange pâle paraît sur ton front quand tu retiens ton souffle trop longtemps."
    verite: "Ton corps met du chakra de côté depuis l'enfance, sans que tu le saches. Le sceau se remplit ; un jour, il rendra tout d'un coup."
    conditions:
      - {palier: 1, si: "des heures passées à soigner sans relâche, jusqu'à l'épuisement",
