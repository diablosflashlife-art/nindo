    accorde: {capacite: shikotsumyaku}
    revelation_initiale: "Tu guéris vite. Trop vite, disait l'infirmerie."
    verite: "Un enfant issu des expériences d'Otogakure, sorti avant que les Kaguya ne deviennent une famille."
    conditions:
      - {palier: 1, si: "une blessure grave",
         indice: "L'os a repoussé de travers, puis s'est redressé seul."}
      - {palier: 2, si: "un combat à mort",
         indice: "Tu as senti ton squelette répondre à ta volonté."}
    contraintes:
      - {type: faction_hostile, cible: kiri, note: "Kiri achève ce qu'elle a commencé."}

  # ===== LÉGENDAIRES =====
  - id: jinchuriki_latent
    nom: "Réceptacle"
    famille: bijuu
    rarete: legendaire
    revelation_initiale: "Tu dors mal. Tu as toujours mal dormi."
    verite: "Un fragment de chakra de bijû est scellé en toi depuis l'enfance."
    conditions:
      - {palier: 1, si: "une colère incontrôlée en situation de danger mortel",
         indice: "Quelque chose a répondu à ta place, une seconde."}
