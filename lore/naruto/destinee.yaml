    verite: "Une lignée Hyôton de Kiri, cachée depuis les purges."
    conditions:
      - {palier: 1, si: "un danger mortel, en présence d'eau ou de froid",
         indice: "L'eau a gelé là où tu l'as touchée."}
      - {palier: 2, si: "la rencontre d'un survivant du clan",
         indice: "Un inconnu réagit à ton nom, puis se reprend."}
    contraintes:
      - {type: faction_hostile, cible: kiri,
         note: "Kiri a purgé les lignées Hyôton. En rester un attire des chasseurs."}
      - {type: secret, note: "Le révéler publiquement coûte 30 de relation au village."}

  - id: sceau_ancien
    nom: "Sceau d'origine inconnue"
    famille: sceau
    rarete: rare
    revelation_initiale: "Tu portes une marque que l'on a toujours appelée une cicatrice."
    verite: "Un sceau de contention apposé dans la petite enfance, par quelqu'un qui te connaissait."
    conditions:
      - {palier: 1, si: "une blessure grave ou une émotion extrême",
         indice: "La marque a chauffé, puis s'est tue."}
      - {palier: 2, si: "l'examen par un spécialiste du fûinjutsu",
         indice: "Ce n'est pas une cicatrice. C'est une écriture."}
      - {palier: 3, si: "la découverte de qui l'a apposé", indice: "Un nom, enfin."}
    contraintes:
      - {type: convoitise, note: "Ce que le sceau retient intéresse quelqu'un."}

  - id: lame_heritee
    nom: "Lame héritée"
    famille: ecole
    rarete: rare
    accorde: {stats: {taijutsu: 2, vitesse: 2}}
    revelation_initiale: "Tu as toujours eu la même lame. Tu ne te souviens pas de l'avoir reçue."
    verite: "Elle a appartenu à un épéiste dont le nom fait encore baisser la voix. Ceux qui la cherchent ne t'ont pas oublié."
    conditions:
      - {palier: 1, si: "un duel où la lame est tirée pour tuer ou être tué",
         indice: "La lame a vibré avant l'impact, comme si elle savait."}
      - {palier: 2, si: "la rencontre de quelqu'un qui reconnaît la lame",
         indice: "Un regard s'est figé sur ta garde. Il savait."}
      - {palier: 3, si: "l'apprentissage de ce que la lame a déjà tranché",
         indice: "Tu connais son nom, maintenant. Elle aussi connaît le tien."}
    contraintes:
      - {type: convoitise, note: "D'autres la veulent, et certains ont le droit de la réclamer."}

  # ===== TRÈS RARES =====
  - id: heritage_uzumaki
    nom: "Lignée Uzumaki dissimulée"
    famille: heritage
    rarete: tres_rare
    eligibilite: {clans: [sans_clan, ""]}
    accorde: {stats: {chakra: 6, endurance: 3}, technique: fuin_base}
    revelation_initiale: "Tes cheveux sont d'un roux qu'on remarque dans la rue."
    verite: "Descendant direct d'un survivant d'Uzushiogakure."
    conditions:
      - {palier: 1, si: "une réserve de chakra anormale constatée par un tiers",
         indice: "Le médecin du village a froncé les sourcils devant tes mesures."}
      - {palier: 2, si: "la rencontre d'un survivant ou d'une archive",
         indice: "Un vieux registre porte un nom proche du tien."}
      - {palier: 3, si: "la maîtrise d'un sceau complexe",
         indice: "Tes mains connaissent des tracés qu'on ne t'a jamais montrés."}
    contraintes:
      - {type: convoitise, note: "Les derniers Uzumaki valent cher, vivants."}

  - id: marque_maudite_trait
    nom: "Marque maudite"
    famille: kekkei_genkai
    rarete: tres_rare
    accorde: {capacite: marque_maudite}
    revelation_initiale: "Rien pour l'instant. Tu es en bonne santé."
    verite: "Quelqu'un t'a choisi comme réceptacle, et viendra te marquer."
    conditions:
      - {palier: 1, si: "une rencontre avec celui qui pose la marque, et y survivre",
         indice: "Une douleur dans la nuque, qui ne passe pas."}
      - {palier: 2, si: "un abandon volontaire au pouvoir de la marque",
         indice: "Tu as aimé la sensation. C'est le problème."}
    contraintes:
      - {type: maitre, note: "Celui qui a posé la marque en garde le contrôle partiel."}
