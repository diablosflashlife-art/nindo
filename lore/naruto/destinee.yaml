      - {palier: 2, si: "une méditation poussée au-delà du raisonnable",
         indice: "Ta peau durcit par endroits. Ça recule, lentement."}
    contraintes:
      - {type: risque_physique, note: "L'échec pétrifie."}

  - id: heritage_kaguya
    nom: "Sang Kaguya"
    famille: heritage
