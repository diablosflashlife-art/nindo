    famille: senjutsu
    rarete: tres_rare
    accorde: {capacite: senjutsu}
    revelation_initiale: "Les lieux anciens te mettent mal à l'aise, et tu ne sais pas pourquoi."
    verite: "Une sensibilité rare à l'énergie naturelle."
    conditions:
      - {palier: 1, si: "l'apprentissage auprès d'un maître d'un lieu sacré",
