         indice: "Il a blêmi en voyant ton ventre."}
      - {palier: 3, si: "un premier dialogue intérieur",
         indice: "Une voix. Elle connaît ton nom."}
      - {palier: 4, si: "un accord, même partiel, avec ce qui est en toi",
         indice: "Vous avez négocié. Ça ne veut pas dire que vous êtes alliés."}
    contraintes:
      - {type: faction_hostile, cible: akatsuki, note: "On collectionne les bijû."}
      - {type: secret, note: "Un village qui l'apprend ne te traite plus jamais pareil."}
      - {type: instabilite, note: "Le sceau se dégrade sous l'émotion."}

  - id: dojutsu_ultime
    nom: "Œil au-delà de l'œil"
    famille: dojutsu_avance
    rarete: legendaire
    eligibilite: {requiert_trait: lignee_sharingan, clans: [uchiha]}
    revelation_initiale: "Ton clan parle parfois d'un palier dont personne ne revient indemne."
    verite: "La lignée porte le potentiel d'un dôjutsu que trois personnes ont atteint en un siècle."
    conditions:
      - {palier: 1, si: "avoir atteint le Mangekyô",
         indice: "La douleur ne s'arrête plus entre les usages."}
      - {palier: 2, si: "un sacrifice que tu regretteras",
         indice: "Le prix était plus élevé que tu ne l'imaginais."}
    contraintes:
      - {type: cout_physique, note: "La vue se paie, définitivement."}
      - {type: convoitise, note: "Tout le monde en veut."}

# --------------------------------------------------------------------------
# TABLE DE SEL — le détail distinctif imposé à chaque PNJ généré.
# Sans elle, un modèle produit des figurants lisses et interchangeables.
# --------------------------------------------------------------------------
sel:
  - "boite légèrement, séquelle d'une mission dont il ne parle pas"
  - "ne regarde jamais son interlocuteur dans les yeux"
  - "parle de son village natal à tout propos"
  - "doit de l'argent à quelqu'un de dangereux"
  - "collectionne quelque chose d'absurde et l'assume"
  - "rit systématiquement au mauvais moment"
  - "ne se sépare jamais d'un objet sans valeur apparente"
  - "corrige la grammaire des autres, même en pleine crise"
  - "a une peur irrationnelle qu'il cache mal"
  - "mange en permanence, quelles que soient les circonstances"
  - "répète la dernière phrase de son interlocuteur avant de répondre"
  - "porte encore l'uniforme d'une unité dissoute"
  - "refuse de dire son prénom et n'utilise que son nom de famille"
  - "note tout dans un carnet qu'il ne montre à personne"
  - "s'adresse aux gens par leur grade, jamais par leur nom"
  - "tousse quand il ment, et le sait"
  - "a élevé quelqu'un dont il n'était pas le parent"
  - "cite des proverbes qu'il invente sur le moment"
  - "se tient toujours dos à un mur"
  - "sourit quand la situation est grave"
  - "parle trop fort parce qu'il entend mal d'une oreille"
  - "a une dette d'honneur envers un village ennemi"
  - "range compulsivement tout ce qui traîne"
  - "évite systématiquement un quartier précis du village"
  - "porte les couleurs d'un clan auquel il n'appartient pas"
  - "s'excuse avant de frapper"
  - "ne dort jamais plus de trois heures d'affilée"
  - "a un frère ou une sœur dont personne ne parle"
  - "garde une technique en réserve et refuse de l'employer"
  - "connaît le nom de tous les enfants du quartier"
  - "compte à voix basse quand il est stressé"
  - "a échoué trois fois à l'examen Chûnin et le raconte volontiers"
  - "ne boit jamais rien qu'il n'a pas versé lui-même"
  - "traite ses armes comme des êtres vivants"
  - "a tué quelqu'un par erreur et s'est arrêté de progresser ce jour-là"
